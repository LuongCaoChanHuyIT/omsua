services:
  - type: web
    name: omsua-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @omsua/shared build && pnpm --filter @omsua/backend build
    startCommand: node apps/backend/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SQLITE_PATH
        value: /tmp/omsua.sqlite
      - key: CORS_ORIGINS
        value: https://omsua-web.vercel.app,https://omsua-admin.vercel.app,https://omsua-web*-luong-cao-chan-huys-projects.vercel.app,https://omsua-admin*-luong-cao-chan-huys-projects.vercel.app
